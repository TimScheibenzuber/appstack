name: Orbit

on:
  push:
    paths: ["orbit/**", ".github/workflows/orbit.yml"]
  pull_request:
    paths: ["orbit/**", ".github/workflows/orbit.yml"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Commit fresh screenshots to orbit/docs/screenshots
        type: boolean
        default: false

concurrency:
  group: orbit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 40
    defaults:
      run:
        working-directory: orbit
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test (macOS)
        run: |
          set +e
          TEST_RUNNER_ORBIT_SHOTS="$RUNNER_TEMP/shots" xcodebuild test -project Orbit.xcodeproj -scheme Orbit -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|warning: |✔ Test|✘|Test run with|TEST (SUCCEEDED|FAILED)" test.log
          exit $status
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
      - name: Build (iOS Simulator)
        if: always()
        run: xcodebuild build -project Orbit.xcodeproj -scheme Orbit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          mkdir -p docs/screenshots
          for f in "$RUNNER_TEMP"/shots/*.png; do sips -Z 1600 "$f" --out "docs/screenshots/$(basename "$f")" >/dev/null; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Orbit: update screenshots [skip ci]" || exit 0
          git push
