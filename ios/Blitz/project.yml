# XcodeGen spec - source of truth for Blitz.xcodeproj.
# Regenerate after adding/removing files:  xcodegen generate
name: Blitz
options:
  bundleIdPrefix: com.appstack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  ClaudeKit:
    path: ClaudeKit

targets:
  Blitz:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ClaudeKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Blitz
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appstack.blitz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

  BlitzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Blitz
      - package: ClaudeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appstack.blitz.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Blitz:
    build:
      targets:
        Blitz: all
        BlitzTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BlitzTests
    run:
      config: Debug
    archive:
      config: Release
